<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — Smart Student Planner</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="auth-layout">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand-icon">📚</div>
        <h1>Smart Student Planner</h1>
        <p>Academic Task Manager System</p>
      </div>

      <p class="auth-title">Welcome back</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input class="form-control" type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" placeholder="Your password" autocomplete="current-password" required />
        </div>

        <p class="form-error" id="error-msg"></p>

        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
          Log In
        </button>
      </form>

      <p class="auth-footer">
        Don't have an account? <a href="/register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
